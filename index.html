<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Descubra seu caminho no Front-End</title>

<link rel="stylesheet" href="css/estilo.css">
<script src="js/script.js" defer></script>
</head>

<body>

<header>
<h1>Descubra seu caminho no Front-End</h1>

<p>
Encontre a melhor direção para começar sua jornada!
</p>

<button type="button" id="botaoTema">
Alternar tema
</button>
</header>

<main>

<section>

<h2>Vamos começar?</h2>

<p>
Informe seu nome e escolha sua área de interesse.
</p>

<form id="formulario">

<label for="nome">Seu nome:</label>

<input
type="text"
id="nome"
placeholder="Digite seu nome"
>

<label for="area">Área de interesse:</label>

<select id="area">

<option value="">Selecione uma área</option>
<option value="html">HTML</option>
<option value="css">CSS</option>
<option value="javascript">JavaScript</option>

</select>

<button type="button" id="botaoOrientacao">
Descobrir meu caminho
</button>

</form>

<div id="resultado"></div>

</section>

</main>

<footer>

<p>
Projeto 3 - Painel Interativo com JavaScript
</p>

</footer>

</body>

</html>
